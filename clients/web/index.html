<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>h-flock office console</title>
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="terminal.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="office">
    <aside>
      <header><h1>office</h1><span id="connection" class="muted">connecting</span></header>
      <nav id="agents" aria-label="Agents"></nav>
      <section class="alerts">
        <h2>alerts</h2>
        <ol id="alerts"></ol>
      </section>
    </aside>
    <section class="conversation">
      <header>
        <div><h2 id="agent-title">Select an agent</h2><span id="agent-state" class="muted"></span></div>
        <div class="header-actions">
          <button id="terminal-toggle" type="button" class="btn-secondary">terminal</button>
          <button id="boards-toggle" type="button">boards</button>
        </div>
      </header>
      <section id="board" hidden></section>
      <section id="terminal-panel" class="terminal-panel" hidden>
        <div class="terminal-bar">
          <div class="terminal-info">
            <span class="terminal-label">Terminal Window (120x32)</span>
            <span id="terminal-mode-badge" class="badge mode-readonly">READ-ONLY</span>
          </div>
          <div class="terminal-controls">
            <button id="toggle-input-mode" type="button" class="btn-mode">Enable Typing</button>
            <button id="reconnect-terminal" type="button" class="btn-mode">Reconnect</button>
          </div>
        </div>
        <div id="terminal-container" class="terminal-container"></div>
      </section>
      <ol id="chat" aria-live="polite"></ol>
      <form id="composer">
        <textarea id="message" rows="2" placeholder="type here…" disabled></textarea>
        <button id="send" type="submit" disabled>send</button>
      </form>
    </section>
  </main>
  <script src="xterm.js"></script>
  <script src="terminal.js"></script>
  <script src="app.js"></script>
</body>
</html>
