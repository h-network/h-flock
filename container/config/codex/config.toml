# Codex defaults for every agent in the office — the counterpart to
# config/claude/settings.json. Baked to ~/.codex/config.toml by the Dockerfile,
# and seeded into per-agent CODEX_HOME dirs by setupConfigDir.
#
# Verify what actually took effect with:  codex doctor
# It prints the resolved approval policy, sandbox mode, MCP servers and auth
# file. Unknown keys are ignored silently, so doctor is the only honest check.

# The office container IS the sandbox: it is disposable, unprivileged (uid 1000)
# and holds nothing but the workspace. Prompting an agent for approval inside it
# achieves nothing except stalling the window, which is the same reasoning
# behind claude's --dangerously-skip-permissions in startAgent.
#
# Both are also what startAgent passes on the command line; setting them here
# means a bare `codex`, run by an agent that forgot the wrapper, behaves the
# same way.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# NOT settable here: the "Co-authored-by: Codex <noreply@openai.com>" commit
# trailer and the "Generated with Codex." PR line.
#
# `git_attribution` is a prompt section codex injects into its developer
# instructions, and `commit_attribution_enabled` — the switch for it — arrives
# in the account response from OpenAI's backend, alongside chatgpt_plan_type
# and chatgpt_account_id. The server decides; there is no config key, which is
# why a `git_attribution = false` line here silently did nothing.
#
# The only local lever is instruction-level: config/agent-guide.md, which lands
# in every workspace as AGENTS.md, tells agents not to add attribution
# trailers. That is a counter-instruction against codex's own developer prompt,
# so treat it as best-effort and check commit messages rather than assuming.

# Left at defaults deliberately:
#
#   history     — usage.py reads ~/.codex*/sessions/**/rollout-*.jsonl for the
#                 dashboard's token/cost strip. Setting history.persistence =
#                 "none" would silently empty that panel.
#   model       — per-agent choice, not an office-wide one.
#   mcp_servers — none configured, which is already the default (doctor
#                 confirms "no MCP servers configured"). claude denies MCP
#                 explicitly because it ships with servers available; codex
#                 does not.
#
# To match claude's tool restriction more closely, uncomment this — codex has
# no --tools equivalent, so config is the only lever:
#
# [tools]
# web_search = false
