# One container is one tenant. Reaching a different tenant means reaching a
# different container (LLD-container §1).
#
#   docker compose -p h-flock-hq -f container/compose.yaml up --build -d
#   docker compose -p h-flock-hq -f container/compose.yaml down -v
#
# ⚠ Always pass -p. On the lab host an unrelated h-cli container is off limits,
# and a project-scoped teardown is what keeps it that way. Never run
# `docker system prune` or `docker stop $(docker ps -q)` there.

services:
  tenant:
    build:
      context: ..
      dockerfile: container/Dockerfile
    # ⚠ Tagged by commit so an existing image proves it matches the source
    # under test. See container/flock-image.sh. Defaults to latest for a
    # caller that has not sourced it.
    image: ${FLOCK_IMAGE:-h-flock:latest}
    # Everything in container/.env reaches the container, so an operator can
    # define any number of providers under any names without editing this file.
    env_file:
      - .env
    environment:
      POD: "${POD:-acme}"
      TENANT: "${TENANT:-hq}"
      # ⚠ name:port_type pairs — the entrypoint rejects a bare name and the container
      # exits. This default was bare from the start and had never been used,
      # because setup.sh always writes a .env that overrides it.
      AGENTS: "${AGENTS:-architect:tmux,sme-2:tmux,sme-3:tmux}"
      ROSTER_POLL_SECONDS: "${ROSTER_POLL_SECONDS:-5}"
      # ⚠ The default MUST be spelled here, not left empty. An unset variable
      # passed through as "" is not absent — `os.environ.get(NAME, "120")` finds
      # the empty string and float("") raises, so a knob nobody set would take
      # the tenant down. The value must also match `watchdog/service.py`'s
      # default, or the image shadows the code the way `Dockerfile:119` did.
      VERIFY_AFTER_SECONDS: "${VERIFY_AFTER_SECONDS:-120}"
      INGRESS_MAX: "${INGRESS_MAX:-300}"
      BOARD_DONE_MAX: "${BOARD_DONE_MAX:-500}"
      DEAD_MAX: "${DEAD_MAX:-500}"
      WINDOW_LOG_MAX_BYTES: "${WINDOW_LOG_MAX_BYTES:-8388608}"
      # Exceptions only — "frontend=codex", "backend=work". Blank when uniform.
      # ⚠ container/.env feeds compose's variable substitution; a variable only
      # reaches the container if it is named here as well.
      AGENT_CLIS: "${AGENT_CLIS:-}"
      AGENT_PROFILES: "${AGENT_PROFILES:-}"
      # Which agents run against a model provider. The NAME is per agent; the
      # address is tenant configuration, so an agent cannot read or change the
      # provider it is pointed at.
      #
      # ⚠ The PROVIDER_<NAME>_* variables are NOT listed here. Naming them would
      # hardcode the provider name — only "local" would ever reach the container,
      # and a tenant with "gpu-a" and "gpu-b" could not work. env_file passes
      # whatever the operator named.
      AGENT_PROVIDERS: "${AGENT_PROVIDERS:-}"
      # No default. The container refuses to start without it.
      API_TOKEN: "${API_TOKEN:?set API_TOKEN in container/.env}"
      # ⚠ The published host, passed in so the entrypoint can judge exposure —
      # the doors bind 0.0.0.0 inside the container and cannot see this mapping.
      # A door published beyond loopback without TLS stops the tenant starting
      # unless ALLOW_PLAINTEXT_PUBLISH=1 says that is intended (`LLD-container` §3.1).
      # ⚠ The doors ALWAYS bind 8080/8081 inside the container; API_PORT and
      # SESSION_PORT choose the HOST side of the mapping only. env_file passes
      # the whole .env in, so without these two overrides a tenant published on
      # any other port binds that port internally, the ":8080" mapping points at
      # nothing, and the tenant comes up unhealthy with a working door nobody
      # can reach. Measured while running a second tenant beside the first.
      API_PORT: "8080"
      SESSION_PORT: "8081"
      # ⚠ OPT-IN. Off by default: the api is the widest surface a tenant has, and
      # a tenant whose agents only talk over the bus never needs it. Named here
      # explicitly rather than left to env_file, because the healthcheck below
      # branches on it and an unset value there would probe a door that is not
      # running. Set API_ENABLED=1 in container/.env to publish it.
      API_ENABLED: "${API_ENABLED:-0}"
      API_HOST: "${API_HOST:-}"
      SESSION_HOST: "${SESSION_HOST:-}"
      ALLOW_PLAINTEXT_PUBLISH: "${ALLOW_PLAINTEXT_PUBLISH:-0}"
      API_TLS_CERT: "${API_TLS_CERT:-}"
      API_TLS_KEY: "${API_TLS_KEY:-}"
      SESSION_TLS_CERT: "${SESSION_TLS_CERT:-}"
      SESSION_TLS_KEY: "${SESSION_TLS_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    # A tenant is either up or it is not; if a module exits the container exits
    # and this brings it back (LLD-container §6).
    restart: unless-stopped
    init: false  # tini is PID 1 from the image's own ENTRYPOINT
    healthcheck:
      # ⚠ Scheme follows the door. With certs configured the api speaks TLS, and
      # a plaintext probe gets "Empty reply from server" forever — measured: a
      # TLS tenant that served perfectly sat `health: starting` until it went
      # unhealthy. -k because the cert is for the published name, not 127.0.0.1.
      #
      # ⚠ And the door is opt-in (API_ENABLED). With it off there is nothing to
      # curl, so liveness is the switch — the one daemon a tenant cannot deliver
      # without. Probing the api unconditionally would take every api-less tenant
      # unhealthy while it forwarded perfectly.
      test: ["CMD-SHELL", "if [ \"$${API_ENABLED:-0}\" = \"0\" ]; then pgrep -f 'python3 -m flock.switch' >/dev/null && redis-cli -u \"$${REDIS_URL:-redis://127.0.0.1:6379/0}\" ping >/dev/null || exit 1; elif [ -n \"$$API_TLS_CERT\" ]; then curl -fsSk -H \"Authorization: Bearer $$API_TOKEN\" https://127.0.0.1:8080/health || exit 1; else curl -fsS -H \"Authorization: Bearer $$API_TOKEN\" http://127.0.0.1:8080/health || exit 1; fi"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # ⚠ Docker's json-file driver had NO cap here, so container stdout — which
    # is every custody record — grew without bound until the container was
    # removed. 5 × 50 MB is roughly a week of a four-agent office.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      # ⚠ THE EVIDENCE OUTLIVES THE CONTAINER. `docker logs` is deleted with the
      # container, so before this a teardown destroyed the only record that a run
      # ever happened — TEST-SIGNOFF's own REFUSED example fails on exactly that.
      # A NAMED volume, so `down` keeps it and only an explicit `down -v` clears
      # it. Everything else in a tenant is deliberately ephemeral; this is not.
      - custody:${CUSTODY_DIR:-/home/ubuntu/.flock/custody}

volumes:
  custody:
    name: "${COMPOSE_PROJECT_NAME:-h-flock}-custody"
