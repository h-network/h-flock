[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h-flock"
version = "0.1.0"
# Classic table form, not the PEP 639 SPDX string: the build floor is
# setuptools>=68, which rejects `license = "MIT"` outright.
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "redis>=5,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # uvicorn ships no WebSocket implementation of its own; without this the
    # session route answers 404 and only logs a warning. Its own tests pass
    # because TestClient does not need one.
    "websockets>=12,<16",
]

[project.scripts]
"flock.port" = "flock.port.__main__:main"
office = "flock.office:main"
cloneToAll = "flock.office.cli:clone_to_all_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
