[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h-flock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # uvicorn ships no WebSocket implementation of its own; without this the
    # session route answers 404 and only logs a warning. Its own tests pass
    # because TestClient does not need one.
    "websockets>=12,<16",
]

[project.scripts]
sendMessage = "flock.adapter.tools:send_message_cli"
sendBroadcast = "flock.adapter.tools:send_broadcast_cli"
peers = "flock.adapter.tools:peers_cli"
"flock.adapter" = "flock.adapter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
