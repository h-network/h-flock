[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h-flock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["redis>=5,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
